<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OpenAgriNet dependencies</title>
<script>
// The dependencies are now the All dependencies tab of the main page. Old links keep their filters: the dependency filters
// take a d prefix there (vuln=any becomes dvuln=any), so they do not clash with the page's repository filters.
(function () {
  var q = new URLSearchParams(location.search), out = new URLSearchParams({ tab: 'deps' });
  var map = { eco: 'deco', license: 'dlicense', risk: 'drisk', vuln: 'dvuln', group: 'dgroup', update: 'dupdate', q: 'dq', sort: 'dsort' };
  q.forEach(function (v, k) { if (k !== 'tab') out.append(map[k] || k, v); });
  location.replace('./?' + out);
})();
</script>
</head>
<body><p><a href="./?tab=deps">The dependencies are on the main page.</a></p></body>
</html>
