name: Refresh and deploy coverage dashboard
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */24 * * *'
  push:
    branches: [main]
    paths: ['index.html', 'deps.html', 'filters.js', 'style.css', 'config/**', 'scripts/**', '.github/workflows/deploy.yml']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: node --test tests/filters.test.mjs
  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false  # the token must not sit in .git/config where npx and its dependencies run
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install requests
      - name: Aggregate existing artifacts (does not run tests)
        env:
          GH_TOKEN: ${{ github.token }}
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
          DPG_PROJECT_TOKEN: ${{ secrets.DPG_PROJECT_TOKEN }}
          GITHUB_ORG: OpenAgriNet
        run: python scripts/aggregate_coverage.py
      - name: Stack, dependencies and licenses (stack-analyser + deps.dev)
        continue-on-error: true  # keep the coverage refresh even if this step fails
        env:
          GH_TOKEN: ${{ github.token }}
          DPG_PROJECT_TOKEN: ${{ secrets.DPG_PROJECT_TOKEN }}
          GITHUB_ORG: OpenAgriNet
        run: python scripts/collect_stack.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
