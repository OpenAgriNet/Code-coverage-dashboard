name: Refresh and deploy coverage dashboard
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */24 * * *'
  push:
    branches: [main]
    paths: ['index.html', 'deps.html', 'assets/**', 'config/**', 'scripts/**', '.github/workflows/deploy.yml']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: node --test tests/filters.test.mjs
  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45   # Docker image scans pull every image
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false  # the token must not sit in .git/config where npx and its dependencies run
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: python -m pip install requests 'urllib3>=2.1'
      - name: Aggregate existing artifacts (does not run tests)
        env:
          GH_TOKEN: ${{ github.token }}
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
          DPG_PROJECT_TOKEN: ${{ secrets.DPG_PROJECT_TOKEN }}
          DPG_QUERY_TOKEN: ${{ secrets.DPG_QUERY_TOKEN }}
          GITHUB_ORG: OpenAgriNet
        run: python scripts/aggregate_coverage.py
      - name: Install osv-scanner (pinned, checksum checked)
        env:
          OSV_VERSION: v2.7.0
          OSV_SHA256: 160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b
        run: |
          curl -fsSL -o "$RUNNER_TEMP/osv-scanner" "https://github.com/google/osv-scanner/releases/download/$OSV_VERSION/osv-scanner_linux_amd64"
          echo "$OSV_SHA256  $RUNNER_TEMP/osv-scanner" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/osv-scanner"
          echo "OSV_SCANNER=$RUNNER_TEMP/osv-scanner" >> "$GITHUB_ENV"
      - name: Stack, dependencies and licenses (stack-analyser + deps.dev + osv-scanner)
        continue-on-error: true  # keep the coverage refresh even if this step fails
        env:
          GH_TOKEN: ${{ github.token }}
          DPG_PROJECT_TOKEN: ${{ secrets.DPG_PROJECT_TOKEN }}
          DPG_QUERY_TOKEN: ${{ secrets.DPG_QUERY_TOKEN }}
          GITHUB_ORG: OpenAgriNet
        run: python scripts/collect_stack.py
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
