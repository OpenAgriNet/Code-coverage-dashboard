name: Refresh and deploy coverage dashboard
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */24 * * *'
  push:
    branches: [main]
    paths: ['index.html', 'config/**', 'scripts/**', '.github/workflows/deploy.yml']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - name: Aggregate existing artifacts (does not run tests)
        env:
          GH_TOKEN: ${{ github.token }}
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
          DPG_PROJECT_TOKEN: ${{ secrets.DPG_PROJECT_TOKEN }}
          GITHUB_ORG: OpenAgriNet
        run: python scripts/aggregate_coverage.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
